name: Nix

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
      - name: Check tree formatting
        run: nix build .#checks.x86_64-linux.formatting -L --no-link

  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      files_changed: ${{ steps.changed-files.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: changed-files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            files:
              - '.github/workflows/nix.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'nix/**'
              - 'flake.nix'
              - 'flake.lock'

  build-packages:
    name: Build Packages
    needs: changes
    if: ${{ needs.changes.outputs.files_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
        with:
          extra_nix_config: extra-experimental-features = nix-command flakes

      - name: Restore and save cached paths
        id: cache-store-restore
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-packages-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'Cargo.lock', 'Cargo.toml', 'crates/**') }}
          restore-prefixes-first-match: nix-packages-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-packages-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never

      - name: Build all circus packages
        run: |
          nix build .#circus-agent-static .#circus-server    .#circus-cli   \
                    .#circus-queue-runner .#circus-evaluator .#circus-agent \
                    .#ci-cargo-artifacts -L --out-link result-circus

  build:
    name: Build ${{ matrix.package }}
    needs: [changes, build-packages]
    if: ${{ needs.changes.outputs.files_changed == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - circus-cli
          - circus-agent
          - circus-agent-static
          - circus-evaluator
          - circus-queue-runner
          - circus-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
      - name: Restore cached paths
        id: cache-store-restore
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-packages-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'Cargo.lock', 'Cargo.toml', 'crates/**') }}
          restore-prefixes-first-match: nix-packages-${{ runner.os }}-

      - name: Build ${{ matrix.package }}
        run: nix build .#${{ matrix.package }} -L --no-link

  vm-test:
    name: ${{ matrix.name }}
    needs: [changes, build-packages]
    if: ${{ needs.changes.outputs.files_changed == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Service Startup
            check: service-startup
          - name: Basic API
            check: basic-api
          - name: Auth RBAC
            check: auth-rbac
          - name: API CRUD
            check: api-crud
          - name: Features
            check: features
          - name: Webhooks
            check: webhooks
          - name: E2E
            check: e2e
          - name: Declarative
            check: declarative
          - name: Distributed
            check: distributed
          - name: Agent Dispatch
            check: agent-dispatch
          - name: GC Pinning
            check: gc-pinning
          - name: Machine Health
            check: machine-health
          - name: Channel Tarball
            check: channel-tarball
          - name: Capability Scheduling
            check: capability-scheduling
          - name: S3 Cache
            check: s3-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
        with:
          enable_kvm: true
          extra_nix_config: |
            system-features = kvm benchmark big-parallel nixos-test uid-range
            extra-experimental-features = nix-command flakes auto-allocate-uids cgroups
            auto-allocate-uids = true
            use-cgroups = true

      - name: Restore cached paths
        id: cache-store-restore
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-packages-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'Cargo.lock', 'Cargo.toml', 'crates/**') }}
          restore-prefixes-first-match: nix-packages-${{ runner.os }}-

      - name: Build ${{ matrix.check }} for x86_64-linux
        run: nix build .#checks.x86_64-linux.${{ matrix.check }} -L --no-link
