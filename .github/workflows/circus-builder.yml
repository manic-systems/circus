name: Circus Builder

on:
  workflow_dispatch:
    inputs:
      runner_url:
        required: true
        type: string
      oidc_audience:
        required: true
        type: string
      agent_binary_url:
        required: true
        type: string
        description: "Pinned circus-agent binary URL matching the queue-runner protocol"
      systems:
        required: true
        type: string
        description: "Comma-separated Nix systems"
      supported_features:
        required: false
        type: string
        default: ""
        description: "Comma-separated supported system features"
      mandatory_features:
        required: false
        type: string
        default: ""
        description: "Comma-separated mandatory system features"
      max_jobs:
        required: true
        type: string
      cores:
        required: true
        type: string
      speed_factor:
        required: true
        type: string
      agent_name:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31

      - name: Request OIDC token
        env:
          AUDIENCE: ${{ inputs.oidc_audience }}
        run: |
          set -euo pipefail
          response="$(
            curl -fsSL \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}"
          )"
          token="$(jq -r '.value' <<<"$response")"
           echo "::add-mask::$token"
           printf 'CIRCUS_AGENT_TOKEN=%s\n' "$token" >>"$GITHUB_ENV"

      - name: Download circus-agent binary
        env:
          AGENT_BINARY_URL: ${{ inputs.agent_binary_url }}
        run: |
          set -euo pipefail
          curl -fsSL "$AGENT_BINARY_URL" -o /tmp/circus-agent
          chmod +x /tmp/circus-agent

      - name: Run circus agent
        env:
          AGENT_NAME: ${{ inputs.agent_name }}
          RUNNER_URL: ${{ inputs.runner_url }}
          SYSTEMS: ${{ inputs.systems }}
          SUPPORTED_FEATURES: ${{ inputs.supported_features }}
          MANDATORY_FEATURES: ${{ inputs.mandatory_features }}
          MAX_JOBS: ${{ inputs.max_jobs }}
          CORES: ${{ inputs.cores }}
          SPEED_FACTOR: ${{ inputs.speed_factor }}
        run: |
          set -euo pipefail

          args=(
            --ephemeral
            --name "$AGENT_NAME"
            --runner-url "$RUNNER_URL"
            --max-jobs "$MAX_JOBS"
            --cores "$CORES"
            --speed-factor "$SPEED_FACTOR"
            --work-dir /tmp/circus-agent
          )

          add_csv_args() {
            local flag="$1"
            local value="$2"
            [[ -z "$value" ]] && return 0
            IFS=',' read -ra items <<<"$value"
            for item in "${items[@]}"; do
              item="${item//[[:space:]]/}"
              [[ -n "$item" ]] && args+=("$flag" "$item")
            done
          }

          add_csv_args --system "$SYSTEMS"
          add_csv_args --supported-feature "$SUPPORTED_FEATURES"
          add_csv_args --mandatory-feature "$MANDATORY_FEATURES"

          exec /tmp/circus-agent "${args[@]}"
