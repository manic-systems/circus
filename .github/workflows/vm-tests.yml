name: NixOS VM Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      files_changed: ${{ steps.changed-files.outputs.files }}
    steps:
      - uses: actions/checkout@v6.0.2
      - id: changed-files
        uses: dorny/paths-filter@v4
        with:
          filters: |
            files:
              - '.github/workflows/vm-tests.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'nix/packages/*'
              - 'nix/modules/**'
              - 'nix/tests/**'
              - 'flake.nix'
              - 'flake.lock'

  build-packages:
    name: Build Packages
    needs: changes
    if: ${{ needs.changes.outputs.files_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: extra-experimental-features = nix-command flakes

      - name: Restore cached paths
        id: cache-store-restore
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'Cargo.lock', 'Cargo.toml', 'crates/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never

      - name: Build all circus packages
        run: |
          nix build .#circus-server .#circus-evaluator .#circus-queue-runner \
                    .#circus-migrate-cli .#circus-agent -L --no-link

  vm-test:
    name: ${{ matrix.name }}
    needs: [changes, build-packages]
    if: ${{ needs.changes.outputs.files_changed == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Service Startup
            check: service-startup
          - name: Basic API
            check: basic-api
          - name: Auth RBAC
            check: auth-rbac
          - name: API CRUD
            check: api-crud
          - name: Features
            check: features
          - name: Webhooks
            check: webhooks
          - name: E2E
            check: e2e
          - name: Declarative
            check: declarative
          - name: Distributed
            check: distributed
          - name: Agent Dispatch
            check: agent-dispatch
          - name: GC Pinning
            check: gc-pinning
          - name: Machine Health
            check: machine-health
          - name: Channel Tarball
            check: channel-tarball
          - name: Capability Scheduling
            check: capability-scheduling
          - name: S3 Cache
            check: s3-cache
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          extra_nix_config: |
            system-features = kvm benchmark big-parallel nixos-test uid-range
            extra-experimental-features = nix-command flakes auto-allocate-uids cgroups
            auto-allocate-uids = true
            use-cgroups = true

      - name: Restore cached paths
        id: cache-store-restore
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'Cargo.lock', 'Cargo.toml', 'crates/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never

      - name: Build ${{ matrix.check }} for x86_64-linux
        run: nix build .#checks.x86_64-linux.${{ matrix.check }} -L --no-link
