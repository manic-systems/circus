name: Tag and Release

on:
  workflow_dispatch:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Format, Lint and Test"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@8e0aa91fd3b74f101424d4e36ac743c8f8403a32 # tmp
    with:
      # The reusable workflow marks semver tags with suffixes as prereleases.
      # While the workspace version is `*-dev`, releases are intentionally
      # published as GitHub prereleases.
      stage: prepare

  build-amd64:
    name: Build ${{ matrix.binary }} (${{ matrix.suffix }})
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: circus-server
            binary: circus-server
            os: ubuntu-latest
            suffix: server-linux-amd64
          - package: circus-evaluator
            binary: circus-evaluator
            os: ubuntu-latest
            suffix: evaluator-linux-amd64
          - package: circus-queue-runner
            binary: circus-queue-runner
            os: ubuntu-latest
            suffix: queue-runner-linux-amd64
          - package: circus-agent
            binary: circus-agent
            os: ubuntu-latest
            suffix: agent-linux-amd64
          - package: circus-cli
            binary: circusctl
            os: ubuntu-latest
            suffix: ctl-linux-amd64
    uses: manic-systems/workflows/.github/workflows/rust-build.yml@8e0aa91fd3b74f101424d4e36ac743c8f8403a32 # tmp
    with:
      upload: true
      version: ${{ needs.prepare.outputs.version }}
      os: ${{ matrix.os }}
      build-command: nix build .#${{ matrix.package }} -L
      binary-name: ${{ matrix.binary }}
      asset-prefix: circus
      suffix: ${{ matrix.suffix }}

  build-arm64:
    name: Build ${{ matrix.binary }} (${{ matrix.suffix }})
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - package: circus-server
            binary: circus-server
            os: ubuntu-24.04-arm
            suffix: server-linux-arm64
          - package: circus-evaluator
            binary: circus-evaluator
            os: ubuntu-24.04-arm
            suffix: evaluator-linux-arm64
          - package: circus-queue-runner
            binary: circus-queue-runner
            os: ubuntu-24.04-arm
            suffix: queue-runner-linux-arm64
          - package: circus-agent
            binary: circus-agent
            os: ubuntu-24.04-arm
            suffix: agent-linux-arm64
          - package: circus-cli
            binary: circusctl
            os: ubuntu-24.04-arm
            suffix: ctl-linux-arm64
    uses: manic-systems/workflows/.github/workflows/rust-build.yml@8e0aa91fd3b74f101424d4e36ac743c8f8403a32 # tmp
    with:
      upload: true
      version: ${{ needs.prepare.outputs.version }}
      os: ${{ matrix.os }}
      build-command: nix build .#${{ matrix.package }} -L
      binary-name: ${{ matrix.binary }}
      asset-prefix: circus
      suffix: ${{ matrix.suffix }}

  finalize:
    name: Finalize Release
    permissions:
      id-token: write
      attestations: write
    needs: [prepare, build-amd64, build-arm64]
    if: ${{ needs.prepare.outputs.skip != 'true' && needs['build-amd64'].result == 'success' && needs['build-arm64'].result == 'success' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@8e0aa91fd3b74f101424d4e36ac743c8f8403a32 # tmp
    with:
      stage: finalize
      version: ${{ needs.prepare.outputs.version }}
      asset-prefix: circus
