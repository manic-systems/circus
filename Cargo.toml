[workspace]
members  = [ "crates/*" ]
resolver = "3"

[workspace.package]
edition      = "2024"
license      = "MPL-2.0"
repository   = "https://github.com/manic-systems/circus"
rust-version = "1.95.0"
version      = "0.11.0"

[workspace.dependencies]
# Workspace Components
circus-agent        = { path = "./crates/agent", version = "0.11.0" }
circus-cli          = { path = "./crates/cli", version = "0.11.0" }
circus-common       = { path = "./crates/common", version = "0.11.0" }
circus-config       = { path = "./crates/config", version = "0.11.0" }
circus-evaluator    = { path = "./crates/evaluator", version = "0.11.0" }
circus-logs         = { path = "./crates/logs", version = "0.11.0" }
circus-migrations   = { path = "./crates/migrations", version = "0.11.0" }
circus-nix          = { path = "./crates/nix", version = "0.11.0" }
circus-notification = { path = "./crates/notification", version = "0.11.0" }
circus-proto        = { path = "./crates/proto", version = "0.11.0" }
circus-queue-runner = { path = "./crates/queue-runner", version = "0.11.0" }
circus-s3           = { path = "./crates/s3", version = "0.11.0" }
circus-server       = { path = "./crates/server", version = "0.11.0" }
circus-types        = { path = "./crates/types", version = "0.11.0" }

# Other dependencies
askama = "0.16.0"
askama_fmt = "0.3.3"
async-compression = { version = "0.4.42", default-features = false, features = [
  "tokio",
  "zstd",
  "xz",
  "gzip",
] }
async-stream = "0.3.6"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = [ "typed-header", "cookie" ] }
base64 = "0.22.1"
capnp = "0.26.0"
capnp-futures = "0.26.0"
capnp-rpc = "0.26.0"
capnpc = "0.26.0"
chrono = { version = "0.4.44", features = [ "serde" ] }
clap = { version = "4.6.1", features = [ "derive" ] }
color-eyre = "0.6.5"
comfy-table = "7.2.2"
config = "0.15.23"
dashmap = "6.2.1"
futures = "0.3.32"
git2 = { version = "0.21.0", features = [ "https" ] }
hex = "0.4.3"
hmac = "0.13.0"
humantime-serde = "1.1.1"
ldap3 = { version = "0.12.1", default-features = false, features = [ "tls-rustls", "tls-rustls-ring" ] }
lettre = { version = "0.11.22", default-features = false, features = [
  "tokio1-rustls-tls",
  "smtp-transport",
  "builder",
] }
libc = "0.2.186"
moka = { version = "0.12.11", features = [ "sync" ] }
nix = { version = "0.31.3", default-features = false, features = [
  "sched",
  "mount",
  "fs",
  "user",
  "process",
] }
nix-nar = "0.4.0"
num_enum = "0.7.6"
oauth2 = "5.0.0"
parking_lot = "0.12.5"
password-hash = { version = "0.6.1", features = [ "getrandom" ] }
percent-encoding = "2.3.2"
procfs = "0.18.0"
regex = "1.12.3"
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "rustls-no-provider",
  "stream",
] }
ring = "0.17.14"
rustls = { version = "0.23.40", default-features = false, features = [ "ring", "std", "tls12" ] }
rustls-native-certs = "0.8.3"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.150"
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
shellexpand = "3.1.2"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "chrono",
  "uuid",
  "migrate",
] }
strip-ansi-escapes = "0.2.1"
subtle = "2.6.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.18"
time = "0.3.47"
tokio = { version = "1.52.3", features = [ "full" ] }
tokio-rustls = { version = "0.26.4", default-features = false, features = [ "ring", "tls12" ] }
tokio-util = { version = "0.7.18", features = [ "io", "compat" ] }
toml = "1.1.2"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = [ "cors", "trace", "limit", "fs", "set-header" ] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [ "env-filter", "json" ] }
url = "2.5.8"
urlencoding = "2.1.3"
utoipa = "5.5.0"
uuid = { version = "1.23.2", features = [ "v4", "serde" ] }
whoami = { version = "2.1.2", features = [ "std" ] }
x509-parser = "0.18.1"

# In fc-common `os::OsRng` is configured out by feature flag.
# argon/std -> password-hash/std -> rand_core/std -> getrandom
# Add it back.
argon2 = { version = "0.5.3", features = [ "std" ] }

# default-features off drops the `pem`/`simple_asn1` deps we don't use; the
# crate keeps ring (matching the rest of our stack) for RS256 verification.
jsonwebtoken = { version = "10.4.0", default-features = false }

# Harmonia does not publish regularly to crates.io, and moves faster on their Github
# repository, providing the features we need *only* on the Git version. While this is
# annoying it's the only way we can use Harmonia to back our binary cache.
harmonia-file-nar              = { git = "https://github.com/nix-community/harmonia.git", rev = "12c6742560dd1ba1e66f5cc2f04cabd4e99ae754" }
harmonia-store-content-address = { git = "https://github.com/nix-community/harmonia.git", rev = "12c6742560dd1ba1e66f5cc2f04cabd4e99ae754" }
harmonia-store-nar-info        = { git = "https://github.com/nix-community/harmonia.git", rev = "12c6742560dd1ba1e66f5cc2f04cabd4e99ae754" }
harmonia-store-path            = { git = "https://github.com/nix-community/harmonia.git", rev = "12c6742560dd1ba1e66f5cc2f04cabd4e99ae754" }
harmonia-store-path-info       = { git = "https://github.com/nix-community/harmonia.git", rev = "12c6742560dd1ba1e66f5cc2f04cabd4e99ae754" }
harmonia-utils-hash            = { git = "https://github.com/nix-community/harmonia.git", rev = "12c6742560dd1ba1e66f5cc2f04cabd4e99ae754" }

# evix, in-process Nix evaluator (nix-eval-jobs replacement) driven as a library.
evix = { version = "0.3.0", features = [ "flake" ] }

# Workspace Clippy lints. All workspace crates must inherit them in individual
# manifests for subcrates. The below list is a rather pedantic list of lints
# that hold the codebase to a relatively high standard. Undesirable rules are
# explicitly allowed below.
# See:
#  <https://doc.rust-lang.org/rustc/lints/listing/allowed-by-default.html>
[workspace.lints.clippy]
cargo      = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
nursery    = { level = "warn", priority = -1 }
pedantic   = { level = "warn", priority = -1 }
perf       = { level = "warn", priority = -1 }
style      = { level = "warn", priority = -1 }

# In the honor of a recent Cloudflare regression
panic       = "deny"
unwrap_used = "deny"

# Lints that are not covered or above lint groups, or those we want to make
# explicit in the case we intend to turn them into 'allow' or 'deny' status
# in the future.
clone_on_ref_ptr                     = "warn"
dbg_macro                            = "warn"
empty_drop                           = "warn"
empty_structs_with_brackets          = "warn"
exit                                 = "warn"
filetype_is_file                     = "warn"
get_unwrap                           = "warn"
infinite_loop                        = "warn"
map_with_unused_argument_over_ranges = "warn"
non_std_lazy_statics                 = "warn"
pathbuf_init_then_push               = "warn"
rc_buffer                            = "warn"
rc_mutex                             = "warn"
rest_pat_in_fully_bound_structs      = "warn"
undocumented_unsafe_blocks           = "warn"
unnecessary_safety_comment           = "warn"
unused_result_ok                     = "warn"


# Less dangerous, but we would still like to know. S
print_stderr  = "warn"
print_stdout  = "warn"
todo          = "warn"
unimplemented = "warn"
unreachable   = "warn"

# The lint groups above enable some less-than-desirable rules, we should
# manually allow those to keep our sanity.
absolute_paths                 = "allow"
arbitrary_source_item_ordering = "allow"
cast_possible_truncation       = "allow"
cast_possible_wrap             = "allow"
cast_precision_loss            = "allow"
cast_sign_loss                 = "allow"
implicit_return                = "allow"
missing_docs_in_private_items  = "allow"
multiple_crate_versions        = "allow" # :(
non_ascii_literal              = "allow"
pattern_type_mismatch          = "allow"
question_mark_used             = "allow"
similar_names                  = "allow"
single_call_fn                 = "allow"
std_instead_of_core            = "allow"
too_long_first_doc_paragraph   = "allow"
too_many_arguments             = "allow" # I don't care
too_many_lines                 = "allow"
unused_trait_names             = "allow"

# False positive:
# clippy's build script check doesn't recognize workspace-inherited metadata
# which means in our current workspace layout, we get pranked by Clippy.
cargo_common_metadata = "allow"


[profile.dev]
debug     = true
opt-level = 0

[profile.release]
lto       = true
opt-level = "z"
strip     = true
