[workspace]
exclude  = [ "db/circus-codegen" ]
members  = [ "crates/*" ]
resolver = "3"

[workspace.package]
edition      = "2024"
license      = "MPL-2.0"
repository   = "https://github.com/manic-systems/circus"
rust-version = "1.95.0"
version      = "0.12.0"

[workspace.dependencies]
# Workspace Components
circus-agent        = { path = "./crates/agent", version = "0.12.0" }
circus-binary-cache = { path = "./crates/binary-cache", version = "0.12.0" }
circus-cli          = { path = "./crates/cli", version = "0.12.0" }
circus-codegen      = { path = "./db/circus-codegen", version = "0.0.0" }
circus-common       = { path = "./crates/common", version = "0.12.0" }
circus-config       = { path = "./crates/config", version = "0.12.0" }
circus-evaluator    = { path = "./crates/evaluator", version = "0.12.0" }
circus-logs         = { path = "./crates/logs", version = "0.12.0" }
circus-migrations   = { path = "./crates/migrations", version = "0.12.0" }
circus-nix          = { path = "./crates/nix", version = "0.12.0" }
circus-notification = { path = "./crates/notification", version = "0.12.0" }
circus-proto        = { path = "./crates/proto", version = "0.12.0" }
circus-queue-runner = { path = "./crates/queue-runner", version = "0.12.0" }
circus-s3           = { path = "./crates/s3", version = "0.12.0" }
circus-server       = { path = "./crates/server", version = "0.12.0" }
circus-types        = { path = "./crates/types", version = "0.12.0" }

# Other dependencies
askama = "0.16.0"
askama_fmt = "0.4.0"
async-compression = { version = "0.4.43", default-features = false, features = [
  "tokio",
  "zstd",
  "xz",
  "gzip",
] }
async-stream = "0.3.6"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = [ "typed-header", "cookie" ] }
base64 = "0.23.0"
blake3 = "1.8.5"
bstr = "1.13.0"
bytes = "1.12.1"
capnp = "0.27.0"
capnp-futures = "0.27.0"
capnp-rpc = "0.27.0"
capnpc = "0.27.0"
chrono = { version = "0.4.44", features = [ "serde" ] }
clap = { version = "4.6.1", features = [ "derive" ] }
color-eyre = "0.6.5"
comfy-table = "7.2.2"
config = "0.15.23"
crc = "3.4.0"
dashmap = "6.2.1"
data-encoding = "2.11.1"
deadpool-postgres = { version = "0.14.1", features = [ "rt_tokio_1" ] }
derive_more = { version = "2.1.1", features = [ "display" ] }
ed25519-dalek = "3.0.0"
futures = "0.3.33"
futures-core = "0.3.33"
futures-sink = "0.3.33"
futures-util = { version = "0.3", features = [ "sink" ] }
getrandom = "0.4.3"
git2 = { version = "0.21.0", features = [ "https" ] }
hex = "0.4.3"
hex-literal = "1.1.0"
hmac = "0.13.0"
humantime-serde = "1.1.1"
ldap3 = { version = "0.12.1", default-features = false, features = [ "tls-rustls", "tls-rustls-ring" ] }
lettre = { version = "0.11.23", default-features = false, features = [
  "tokio1-rustls-tls",
  "smtp-transport",
  "builder",
] }
libc = "0.2.189"
md5 = "0.8.1"
moka = { version = "0.12.15", features = [ "sync" ] }
nix = { version = "0.31.3", default-features = false, features = [
  "sched",
  "mount",
  "fs",
  "user",
  "process",
] }
nix-nar = "0.5.0"
num_enum = "0.7.6"
oauth2 = "5.0.0"
parking_lot = "0.12.5"
password-hash = { version = "0.6.1", features = [ "getrandom" ] }
percent-encoding = "2.3.2"
pin-project-lite = "0.2"
proptest = "1.11.0"
proptest-derive = "0.8.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "rustls-no-provider",
  "stream",
] }
ring = "0.17.14"
rstest = "0.26.1"
rust_decimal = "1.42.1"
rustls = { version = "0.23.43", default-features = false, features = [ "ring", "std", "tls12" ] }
rustls-native-certs = "0.8.4"
rustls-pki-types = { version = "1.15.1", features = [ "std" ] }
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
sha1 = "0.11.0"
sha2 = "0.11.0"
shellexpand = "3.1.2"
strip-ansi-escapes = "0.2.1"
subtle = "2.6.1"
sysinfo = { version = "0.39.6", default-features = false, features = [ "system" ] }
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.18"
time = "0.3.55"
tokio = { version = "1.53.1", features = [ "full" ] }
tokio-postgres = { version = "0.7.18", features = [ "with-chrono-0_4", "with-uuid-1", "with-serde_json-1" ] }
tokio-postgres-rustls = "0.14"
tokio-rusqlite = "0.7.0"
tokio-rustls = { version = "0.26.4", default-features = false, features = [ "ring", "tls12" ] }
tokio-test = "0.4.5"
tokio-util = { version = "0.7.19", features = [ "io", "compat" ] }
toml = "1.1.4"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = [ "cors", "trace", "limit", "fs", "set-header" ] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [ "env-filter", "json" ] }
url = "2.5.8"
urlencoding = "2.1.3"
utoipa = "5.5.0"
uuid = { version = "1.24.0", features = [ "v4", "serde" ] }
walkdir = "2.5.0"
webpki-roots = "1"
whoami = { version = "2.1.2", features = [ "std" ] }
x509-parser = "0.18.1"
zerocopy = { version = "0.8.55", features = [ "derive" ] }
zeroize = "1.9.0"

# In fc-common `os::OsRng` is configured out by feature flag.
# argon/std -> password-hash/std -> rand_core/std -> getrandom
# Add it back.
argon2 = { version = "0.5.3", features = [ "std" ] }

# default-features off drops the `pem`/`simple_asn1` deps we don't use; the
# crate keeps ring (matching the rest of our stack) for RS256 verification.
jsonwebtoken = { version = "11.0.0", default-features = false }

# In-house crates and Nix utilities
cognos = "1.0.1"
evix   = { version = "2.0.2", features = [ "flake" ] }

# Workspace Clippy lints. All workspace crates must inherit them in individual
# manifests for subcrates. The below list is a rather pedantic list of lints
# that hold the codebase to a relatively high standard. Undesirable rules are
# explicitly allowed below.
# See:
#  <https://doc.rust-lang.org/rustc/lints/listing/allowed-by-default.html>
[workspace.lints.clippy]
cargo      = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
nursery    = { level = "warn", priority = -1 }
pedantic   = { level = "warn", priority = -1 }
perf       = { level = "warn", priority = -1 }
style      = { level = "warn", priority = -1 }

# In the honor of a recent Cloudflare regression
panic       = "deny"
unwrap_used = "deny"

# Lints that are not covered or above lint groups, or those we want to make
# explicit in the case we intend to turn them into 'allow' or 'deny' status
# in the future.
clone_on_ref_ptr                     = "warn"
dbg_macro                            = "warn"
empty_drop                           = "warn"
empty_structs_with_brackets          = "warn"
exit                                 = "warn"
filetype_is_file                     = "warn"
get_unwrap                           = "warn"
infinite_loop                        = "warn"
map_with_unused_argument_over_ranges = "warn"
non_std_lazy_statics                 = "warn"
pathbuf_init_then_push               = "warn"
rc_buffer                            = "warn"
rc_mutex                             = "warn"
rest_pat_in_fully_bound_structs      = "warn"
undocumented_unsafe_blocks           = "warn"
unnecessary_safety_comment           = "warn"
unused_result_ok                     = "warn"


# Less dangerous, but we would still like to know. S
print_stderr  = "warn"
print_stdout  = "warn"
todo          = "warn"
unimplemented = "warn"
unreachable   = "warn"

# The lint groups above enable some less-than-desirable rules, we should
# manually allow those to keep our sanity.
absolute_paths                 = "allow"
arbitrary_source_item_ordering = "allow"
cast_possible_truncation       = "allow"
cast_possible_wrap             = "allow"
cast_precision_loss            = "allow"
cast_sign_loss                 = "allow"
implicit_return                = "allow"
missing_docs_in_private_items  = "allow"
multiple_crate_versions        = "allow" # :(
non_ascii_literal              = "allow"
pattern_type_mismatch          = "allow"
question_mark_used             = "allow"
similar_names                  = "allow"
single_call_fn                 = "allow"
std_instead_of_core            = "allow"
too_long_first_doc_paragraph   = "allow"
too_many_arguments             = "allow" # I don't care
too_many_lines                 = "allow"
unused_trait_names             = "allow"

# False positive:
# clippy's build script check doesn't recognize workspace-inherited metadata
# which means in our current workspace layout, we get pranked by Clippy.
cargo_common_metadata = "allow"


[profile.dev]
debug     = true
opt-level = 0

[profile.release]
lto       = true
opt-level = "z"
strip     = true
