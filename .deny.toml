[advisories]
ignore = [  ]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

exceptions = [
  { allow = [
    "EUPL-1.2",
  ], crate = "evix" },
  { allow = [
    "EUPL-1.2",
  ], crate = "cognos" },
  { allow = [
    "EUPL-1.2",
  ], crate = "pound" },
  { allow = [
    "EUPL-1.2",
  ], crate = "pound-derive" },
]

[licenses.private]
ignore     = false
registries = [  ]

[bans]
allow                      = [  ]
allow-workspace            = true
deny                       = [  ]
external-default-features  = "allow"
highlight                  = "all"
multiple-versions          = "warn"
skip                       = [  ]
skip-tree                  = [  ]
wildcards                  = "deny"
workspace-default-features = "allow"

[sources]
allow-git        = [  ]
allow-registry   = [ "https://github.com/rust-lang/crates.io-index" ]
unknown-git      = "deny"
unknown-registry = "deny"

[sources.allow-org]
bitbucket = [  ]
github    = [  ]
gitlab    = [  ]
